apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-connection-test
  labels:
    app: argocd-connection-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: argocd-connection-test
  template:
    metadata:
      labels:
        app: argocd-connection-test
    spec:
      containers:
        - name: http-echo
          image: ealen/echo-server:0.5.2
          ports:
            - containerPort: 80
